[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capstone-validation-portfolio-ga"
version = "1.0.0"
description = "Selección genética de una cartera de validación para Gatling AI Performance Copilot"
requires-python = ">=3.11"

[project.scripts]
capstone-portfolio-ga = "validation_portfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

